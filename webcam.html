<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Core — Face Controller</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    body.standalone-cam {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: #040812;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body.standalone-cam #webcam-container {
      position: static !important;
      width: 100% !important;
      height: 100% !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      display: flex;
      flex-direction: column;
      background: #040812;
    }
    body.standalone-cam #webcam-video-wrap {
      flex: 1;
      height: auto !important;
      min-height: 200px;
    }
    body.standalone-cam #webcam-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #standalone-banner {
      background: rgba(0, 255, 136, 0.12);
      border-bottom: 1px solid rgba(0, 255, 136, 0.35);
      color: #00ff88;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>
<body class="standalone-cam">
  <div id="standalone-banner">
    <span>⚡ SEPARATE WEBCAM CONTROLLER</span>
    <span style="color:#00f0ff;font-size:10px;">STREAMING LIVE TO GAME</span>
  </div>

  <script>
    window.IS_STANDALONE = true;
  </script>
  <script src="webcam.js"></script>
</body>
</html>
